name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # dbus-daemon runs the integration tests against a private bus.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOARCH=386 go vet ./...
      - run: go test -race -count=1 ./...
      - name: Fuzz smoke
        run: |
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s .
          go test -run '^$' -fuzz '^FuzzSkip$' -fuzztime 20s .
          go test -run '^$' -fuzz '^FuzzCheck$' -fuzztime 20s .
